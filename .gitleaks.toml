title = "Murmur secret scanning"
[extend]
useDefault = true

# This exact historical test value is used only by the in-memory mock transport.
[[allowlists]]
description = "Synthetic route-check credential"
condition = "AND"
paths = ['''(^|/)app/check_routes\.swift$''']
regexTarget = "secret"
regexes = ['''^sk-test-SECRET-1234567890$''']
