<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Dictation synthetic field probes</title>
<body>
<h1>Disposable dictation probes</h1>
<p>Local synthetic text only. No forms, network requests, or submission actions.</p>
<p><label>Plain text <textarea rows="4" cols="60">Browser probe: </textarea></label></p>
<p id="rich-label">Rich text</p>
<div contenteditable="true" role="textbox" aria-labelledby="rich-label" style="border:1px solid;padding:1em">Rich probe: </div>
<p><label>Password safety probe <input type="password" autocomplete="off"></label></p>
</body>
</html>
